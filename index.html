<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Blooket Answer Lookup</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: 'Segoe UI', system-ui, sans-serif;
      background: #0f0f1a;
      color: #e0e0e0;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .container {
      background: #1a1a2e;
      border-radius: 16px;
      padding: 40px;
      width: 90%;
      max-width: 700px;
      box-shadow: 0 20px 60px rgba(0,0,0,0.5);
    }
    h1 {
      color: #fff;
      font-size: 1.8rem;
      margin-bottom: 8px;
    }
    .sub {
      color: #888;
      font-size: 0.9rem;
      margin-bottom: 28px;
    }
    .input-group {
      display: flex;
      gap: 10px;
      margin-bottom: 20px;
    }
    input[type="text"] {
      flex: 1;
      background: #16213e;
      border: 1px solid #0f3460;
      color: #fff;
      padding: 14px 18px;
      border-radius: 10px;
      font-size: 1rem;
      outline: none;
      transition: border-color 0.2s;
    }
    input[type="text"]:focus { border-color: #e94560; }
    button {
      background: #e94560;
      color: #fff;
      border: none;
      padding: 14px 28px;
      border-radius: 10px;
      font-size: 1rem;
      font-weight: 600;
      cursor: pointer;
      transition: background 0.2s;
    }
    button:hover { background: #c73650; }
    button:disabled { background: #555; cursor: not-allowed; }
    .status {
      padding: 12px 16px;
      border-radius: 8px;
      margin-bottom: 16px;
      font-size: 0.9rem;
      display: none;
    }
    .status.show { display: block; }
    .status.ok { background: #1a3a2a; color: #4ade80; border: 1px solid #166534; }
    .status.err { background: #3a1a1a; color: #f87171; border: 1px solid #7f1d1d; }
    .results { margin-top: 20px; }
    .q-card {
      background: #16213e;
      border: 1px solid #0f3460;
      border-radius: 10px;
      padding: 16px 20px;
      margin-bottom: 12px;
    }
    .q-text { font-weight: 600; color: #fff; margin-bottom: 10px; }
    .a-row {
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 6px 10px;
      border-radius: 6px;
      margin-bottom: 4px;
      font-size: 0.9rem;
    }
    .a-row.correct { background: #14532d; color: #4ade80; font-weight: 600; }
    .a-row.wrong { background: #1a1a2e; color: #888; }
    .badge {
      font-size: 0.7rem;
      background: #166534;
      color: #4ade80;
      padding: 2px 8px;
      border-radius: 4px;
      font-weight: 700;
      text-transform: uppercase;
    }
    .meta {
      color: #666;
      font-size: 0.8rem;
      margin-top: 8px;
    }
    .search-bar {
      margin-bottom: 16px;
      display: none;
    }
    .search-bar.show { display: block; }
  </style>
</head>
<body>
  <div class="container">
    <h1>Blooket Answer Lookup</h1>
    <p class="sub">Enter a lobby ID. Fetches the full question set and correct answers.</p>

    <div class="input-group">
      <input type="text" id="gameId" placeholder="Lobby ID (e.g. 123456)" maxlength="10" />
      <button id="fetchBtn" onclick="fetchAnswers()">Fetch</button>
    </div>

    <div class="status" id="status"></div>

    <div class="search-bar" id="searchBar">
      <input type="text" id="searchQ" placeholder="Search questions..." oninput="renderFiltered()" />
    </div>

    <div class="results" id="results"></div>
  </div>

  <script>
    let allData = null;

    function showStatus(msg, ok) {
      const el = document.getElementById('status');
      el.textContent = msg;
      el.className = 'status show ' + (ok ? 'ok' : 'err');
    }

    async function fetchAnswers() {
      const gameId = document.getElementById('gameId').value.trim();
      if (!gameId) return showStatus('Enter a lobby ID', false);

      const btn = document.getElementById('fetchBtn');
      btn.disabled = true;
      btn.textContent = 'Fetching...';
      showStatus('Joining game...', true);

      try {
        const res = await fetch('/api/lookup', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ gameId }),
        });
        const data = await res.json();
        if (data.error) throw new Error(data.error);

        allData = data;
        showStatus(`Found "${data.setName}" — ${data.questionCount} questions. Saved to saves/`, true);
        document.getElementById('searchBar').classList.add('show');
        renderFiltered();
      } catch (e) {
        showStatus(e.message, false);
      } finally {
        btn.disabled = false;
        btn.textContent = 'Fetch';
      }
    }

    function renderFiltered() {
      const query = document.getElementById('searchQ').value.toLowerCase();
      const container = document.getElementById('results');
      container.innerHTML = '';

      if (!allData) return;

      const entries = Object.entries(allData.answers).filter(([q]) =>
        q.toLowerCase().includes(query)
      );

      for (const [question, info] of entries) {
        const card = document.createElement('div');
        card.className = 'q-card';

        let html = `<div class="q-text">${escapeHtml(question)}</div>`;
        for (const a of info.answers) {
          const cls = a.correct ? 'correct' : 'wrong';
          const badge = a.correct ? '<span class="badge">correct</span>' : '';
          html += `<div class="a-row ${cls}">${escapeHtml(a.text)} ${badge}</div>`;
        }
        if (info.timeLimit) html += `<div class="meta">Time limit: ${info.timeLimit}s</div>`;

        card.innerHTML = html;
        container.appendChild(card);
      }
    }

    function escapeHtml(str) {
      const div = document.createElement('div');
      div.textContent = str;
      return div.innerHTML;
    }
  </script>
</body>
</html>
